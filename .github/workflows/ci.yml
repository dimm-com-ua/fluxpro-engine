name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features
      - name: Keep backend features independent of Leptos
        run: |
          cargo tree --no-default-features --features full --edges normal --prefix none > backend-dependencies.txt
          if grep -E '^(leptos|web-sys|wasm-bindgen|js-sys) ' backend-dependencies.txt; then
            echo 'Backend features must not enable editor dependencies' >&2
            exit 1
          fi
      - run: cargo test --features editor
      - run: cargo test --features editor-ssr
      - run: cargo check --features editor-csr --target wasm32-unknown-unknown --bins
      - run: cargo check --features editor-hydrate --target wasm32-unknown-unknown
      - run: cargo rustdoc --features editor-ssr --lib -- -D missing-docs -D rustdoc::broken_intra_doc_links
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluxpro_test
          POSTGRES_PASSWORD: fluxpro_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --features full,migration-repair,editor-ssr
      - name: Check durable PostgreSQL transitions
        run: cargo test --features full,migration-repair,editor-ssr --test durable_transitions -- --ignored --test-threads=4
        env:
          DATABASE_URL: postgres://fluxpro_test:fluxpro_test@localhost:5432/postgres
      - name: Check editor administration integration
        run: cargo test --features full,migration-repair,editor-ssr --test editor_admin -- --ignored
        env:
          DATABASE_URL: postgres://fluxpro_test:fluxpro_test@localhost:5432/postgres
      - name: Check public API documentation
        run: cargo rustdoc --features full,migration-repair,editor-ssr --lib -- -D missing-docs -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_rust_codeblocks
      - run: cargo package --allow-dirty
      - run: cargo package --allow-dirty --features editor-ssr,admin
