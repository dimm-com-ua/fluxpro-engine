[package]
name = "fluxpro-engine"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "A feature-gated workflow and process engine"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/fluxpro-engine"
repository = "https://github.com/dimm-com-ua/fluxpro-engine"
keywords = ["workflow", "process", "engine", "bpm"]
categories = ["asynchronous"]

[workspace]
members = ["crates/fluxpro-editor"]
resolver = "3"

[features]
default = []
db = ["dep:sqlx", "dep:log", "dep:tracing"]
admin = ["db", "dep:thiserror"]
runtime = [
    "db",
    "dep:lazy_static",
    "dep:rhai",
    "dep:tokio",
    "dep:tracing",
]
api = ["runtime", "dep:actix-web", "dep:serde_yaml"]
full = ["api", "admin"]

[dependencies]
actix-web = { version = "4.5.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_yaml = { version = "0.9", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "time", "uuid", "chrono", "bigdecimal"], optional = true }

chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", optional = true }

uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1"
rhai = { version = "1.23.4", features = ["serde"], optional = true }
regex = "1"
rand = "0.8"
iso8601 = "0.6.3"

anyhow = "1"
tracing = { version = "0.1", optional = true }
lazy_static = { version = "1.5.0", optional = true }
thiserror = { version = "2.0", optional = true }

[[example]]
name = "validate_yaml"
required-features = ["api"]

[[example]]
name = "service_handler"
required-features = ["runtime"]

[[example]]
name = "run_workflow"
required-features = ["api"]

[[example]]
name = "recover_incident"
required-features = ["runtime"]

[[example]]
name = "business_workflows"
required-features = ["api"]
