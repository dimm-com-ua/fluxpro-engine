[package]
name = "fluxpro-engine"
version = "0.1.8"
edition = "2024"
rust-version = "1.85"
description = "A feature-gated workflow and process engine"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/fluxpro-engine"
repository = "https://github.com/dimm-com-ua/fluxpro-engine"
keywords = ["workflow", "process", "engine", "bpm"]
categories = ["asynchronous"]

[workspace]
resolver = "3"

[features]
default = []
db = ["dep:sqlx", "dep:log", "dep:tracing"]
migration-repair = ["db", "dep:serde_yaml"]
admin = ["db", "dep:thiserror"]
runtime = [
    "db",
    "dep:lazy_static",
    "dep:rhai",
    "dep:tokio",
    "dep:tracing",
]
api = ["runtime", "dep:actix-web", "dep:serde_yaml"]
# Keep `full` backend-only for existing service consumers.
full = ["api", "admin"]
editor = [
    "dep:leptos", "dep:web-sys", "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures", "dep:js-sys", "dep:serde_yaml",
    "dep:getrandom", "uuid/js",
]
editor-csr = ["editor", "leptos/csr"]
editor-hydrate = ["editor", "leptos/hydrate"]
editor-ssr = ["editor", "leptos/ssr"]

[dependencies]
actix-web = { version = "4.5.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_yaml = { version = "0.9", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "time", "uuid", "chrono", "bigdecimal"], optional = true }

chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4", optional = true }

uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1"
rhai = { version = "1.23.4", features = ["serde"], optional = true }
regex = "1"
rand = "0.8"
iso8601 = "0.6.3"

anyhow = "1"
tracing = { version = "0.1", optional = true }
lazy_static = { version = "1.5.0", optional = true }
thiserror = { version = "2.0", optional = true }

# UI dependencies are opt-in; model, runtime and API consumers do not need them.
leptos = { version = "0.8.20", default-features = false, optional = true }
web-sys = { version = "0.3", features = ["DomRect", "DataTransfer", "File", "FileList", "HtmlInputElement", "PointerEvent", "WheelEvent"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_qs = "0.15"

[[bin]]
name = "editor-demo"
path = "examples/editor-demo/demo.rs"
required-features = ["editor-csr"]

[[example]]
name = "validate_yaml"
required-features = ["api"]

[[example]]
name = "service_handler"
required-features = ["runtime"]

[[example]]
name = "run_workflow"
required-features = ["api"]

[[example]]
name = "recover_incident"
required-features = ["runtime"]

[[example]]
name = "business_workflows"
required-features = ["api"]
